<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ultimate NASA Solar System</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:black;font-family:'Courier New',monospace}
canvas{display:block}
#menuBtn{position:fixed;top:18px;left:18px;width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(16px);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;z-index:1000;cursor:pointer}
#menuBtn span{width:22px;height:2px;background:white;border-radius:3px}
#panel{position:fixed;top:74px;left:18px;width:260px;padding:18px;border-radius:20px;background:rgba(8,10,20,.75);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(20px);color:white;z-index:999;display:none}
#panel.open{display:block}
button{width:100%;padding:10px;border:none;border-radius:12px;background:rgba(255,255,255,.08);color:white;cursor:pointer;margin-bottom:14px;transition:.25s}
button:hover{background:rgba(255,255,255,.16)}
.row{margin-bottom:16px}
.row label{display:block;margin-bottom:8px;font-size:12px;color:#aaa}
input[type=range]{width:100%}
.toggle{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.switch{position:relative;width:44px;height:24px}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:rgba(255,255,255,.15);border-radius:20px;cursor:pointer;transition:.3s}
.slider:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;border-radius:50%;background:white;transition:.3s}
.switch input:checked+.slider{background:#4da3ff}
.switch input:checked+.slider:before{transform:translateX(20px)}
#planetHUD{position:fixed;right:22px;bottom:22px;width:300px;max-height:86vh;padding:0;border-radius:22px;background:rgba(6,8,18,.88);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(26px);color:white;z-index:999;display:none;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.7)}
#hudHeader{padding:16px 18px 10px;border-bottom:1px solid rgba(255,255,255,.08)}
#planetName{font-size:21px;font-weight:bold;letter-spacing:1px;margin:0 0 2px}
#planetSubtitle{font-size:10px;color:#7aa3cc;letter-spacing:2px;text-transform:uppercase}
#hudBody{padding:12px 18px 14px;overflow-y:auto;max-height:calc(86vh - 120px)}
#hudBody::-webkit-scrollbar{width:4px}
#hudBody::-webkit-scrollbar-track{background:transparent}
#hudBody::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:4px}
#hudNav{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid rgba(255,255,255,.08);gap:8px}
#hudNav button{flex:1;padding:8px 0;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:rgba(255,255,255,.07);color:white;cursor:pointer;font-size:13px;transition:.2s;margin:0}
#hudNav button:hover{background:rgba(255,255,255,.18)}
#hudNavLabel{flex:2;text-align:center;font-size:10px;color:#6a90b0;letter-spacing:1px}
.hud-section{margin-bottom:12px}
.hud-section-title{font-size:9px;letter-spacing:2.5px;color:#4a7fa8;text-transform:uppercase;margin-bottom:7px;font-weight:600}
.hud-row{display:flex;justify-content:space-between;align-items:center;margin:5px 0;font-size:12px;padding:5px 8px;border-radius:8px;background:rgba(255,255,255,.04)}
.hud-row span:first-child{color:#9ab8d0;display:flex;align-items:center;gap:6px}
.hud-row span:last-child{color:#e8f4ff;font-weight:600;text-align:right;max-width:135px}
.hud-divider{height:1px;background:rgba(255,255,255,.07);margin:10px 0}
.fun-fact-box{background:linear-gradient(135deg,rgba(30,80,140,.35),rgba(60,20,100,.35));border:1px solid rgba(100,160,255,.18);border-radius:12px;padding:10px 12px;font-size:11px;line-height:1.6;color:#c8dff5;margin-top:4px}
.fun-fact-label{font-size:9px;letter-spacing:2px;color:#7fa8d0;text-transform:uppercase;margin-bottom:5px;display:block}
#backBtn{position:fixed;top:18px;right:18px;padding:10px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.08);backdrop-filter:blur(16px);color:white;z-index:999;display:none;cursor:pointer}
.speed-row{display:flex;align-items:center;gap:10px}
.speed-row input{flex:1}
#speedVal{font-size:13px;color:#4da3ff;font-weight:bold;min-width:30px;text-align:right}
.tap-hint{font-size:10px;color:rgba(255,255,255,.3);text-align:center;padding:6px 0 0;letter-spacing:1px}
#cinemaTitle{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);color:white;letter-spacing:4px;font-size:13px;opacity:0;transition:1s;z-index:101}
#cinemaTitle.visible{opacity:1}
</style>
</head>
<body>

<div id="menuBtn"><span></span><span></span><span></span></div>

<div id="panel">
  <button id="pauseBtn">⏸ Pause</button>
  <button id="cinemaBtn">🎬 Cinema Mode</button>
  <button id="musicBtn">🎵 Play Music</button>
  <div class="toggle">
    <span style="font-size:13px;color:#ccc">Auto Screensaver</span>
    <label class="switch"><input type="checkbox" id="autoCinemaToggle" checked><span class="slider"></span></label>
  </div>
  <div class="toggle">
    <span style="font-size:13px;color:#ccc">Pinch to Zoom</span>
    <label class="switch"><input type="checkbox" id="pinchZoomToggle" checked><span class="slider"></span></label>
  </div>
  <div class="row">
    <label>Simulation Speed</label>
    <div class="speed-row">
      <input type="range" id="speedControl" min="0.1" max="8" step="0.1" value="2">
      <span id="speedVal">2x</span>
    </div>
  </div>
  <div class="tap-hint">DOUBLE TAP a planet to view info</div>
</div>

<div id="planetHUD">
  <div id="hudHeader">
    <div id="planetName">Earth</div>
    <div id="planetSubtitle">Solar System</div>
  </div>
  <div id="hudBody"><div id="planetStats"></div></div>
  <div id="hudNav">
    <button id="prevPlanet">◀ Prev</button>
    <span id="hudNavLabel">NAVIGATE</span>
    <button id="nextPlanet">Next ▶</button>
  </div>
</div>
<button id="backBtn">← Overview</button>
<div id="cinemaTitle"></div>
<audio id="bgMusic" src="https://files.catbox.moe/ezgtnc.mp3" loop></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
<script>

const $=id=>document.getElementById(id);

/* RENDERER */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.setClearColor(0x000000,1);
document.body.appendChild(renderer.domElement);

/* SCENE / CAMERA / CONTROLS */
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,.1,100000);
camera.position.set(0,140,320);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.minDistance=20;controls.maxDistance=1200;controls.enableDamping=true;controls.dampingFactor=.06;

/* LIGHTS */
scene.add(new THREE.PointLight(0xfff5e0,2,100000));
scene.add(new THREE.AmbientLight(0x334466,.35));

/* TEXTURES */
const loader=new THREE.TextureLoader();
function tex(url){const t=loader.load(url);t.encoding=THREE.sRGBEncoding;return t;}

/* STARS */
function makeStars(count,range,size,opacity,attenuation=true){
  const geo=new THREE.BufferGeometry(),v=[];
  for(let i=0;i<count;i++) v.push((Math.random()-.5)*range,(Math.random()-.5)*range,(Math.random()-.5)*range);
  geo.setAttribute("position",new THREE.Float32BufferAttribute(v,3));
  return new THREE.Points(geo,new THREE.PointsMaterial({color:0xffffff,size,transparent:true,opacity,sizeAttenuation:attenuation}));
}
const bgStars=makeStars(12000,90000,.8,.7);
const fgStars=makeStars(2500,4000,2.4,.95,false);
scene.add(bgStars);scene.add(fgStars);

/* LABELS */
function createLabel(text,size,y){
  const c=document.createElement("canvas");c.width=1024;c.height=256;
  const ctx=c.getContext("2d");ctx.fillStyle="white";ctx.font="Bold 100px Arial";ctx.textAlign="center";ctx.fillText(text,512,170);
  const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:true}));
  sprite.scale.set(size,size/4,1);sprite.position.set(0,y,0);return sprite;
}

/* ORBITS */
function orbit(r){
  const ring=new THREE.Mesh(new THREE.RingGeometry(r-.08,r+.08,256),new THREE.MeshBasicMaterial({color:0x8888aa,transparent:true,opacity:.14,side:THREE.DoubleSide}));
  ring.rotation.x=Math.PI/2;scene.add(ring);
}

/* PLANETS */
const clickable=[];
function createPlanet(name,size,texture,distance,revSpeed,rotSpeed,tilt){
  const pivot=new THREE.Object3D();scene.add(pivot);orbit(distance);
  const group=new THREE.Object3D();group.position.x=distance;group.rotation.z=THREE.MathUtils.degToRad(tilt);pivot.add(group);
  const mesh=new THREE.Mesh(new THREE.SphereGeometry(size,64,64),new THREE.MeshStandardMaterial({map:tex(texture),roughness:.9}));
  group.add(mesh);mesh.add(createLabel(name,size*6,size+4));
  clickable.push({name,mesh,pivot,size,revSpeed,rotSpeed});
  return {mesh,pivot,group};
}

/* SUN */
const sun=new THREE.Mesh(new THREE.SphereGeometry(16,96,96),new THREE.MeshBasicMaterial({map:tex("https://i.ibb.co/WvBs5KVt/8k-sun.jpg")}));
scene.add(sun);sun.add(createLabel("Sun",42,28));
clickable.push({name:"Sun",mesh:sun,size:16,revSpeed:0,rotSpeed:.0004});

/* MERCURY & VENUS */
createPlanet("Mercury",2,"https://i.ibb.co/SDfD6x3R/8k-mercury.jpg",24,.003,.002,.03);
const venusObj=createPlanet("Venus",3,"https://i.ibb.co/BHDyw7tx/8k-venus-surface.jpg",38,.0018,.004,177);
venusObj.mesh.children.forEach(c=>{if(c.isSprite) c.position.y=-5;});

/* EARTH */
const earthPivot=new THREE.Object3D();scene.add(earthPivot);orbit(54);
const earthGroup=new THREE.Object3D();earthGroup.position.x=54;earthGroup.rotation.z=THREE.MathUtils.degToRad(23.5);earthPivot.add(earthGroup);
const earthMesh=new THREE.Mesh(new THREE.SphereGeometry(3.8,64,64),new THREE.MeshStandardMaterial({
  map:tex("https://i.ibb.co/35g0v42J/8k-earth-daymap.jpg"),
  emissiveMap:tex("https://files.catbox.moe/mehul2.jpg"),
  emissive:new THREE.Color(0xffffff),emissiveIntensity:1.2,roughness:.9
}));
earthGroup.add(earthMesh);
const cloudMesh=new THREE.Mesh(new THREE.SphereGeometry(3.88,64,64),new THREE.MeshStandardMaterial({map:tex("https://files.catbox.moe/065hhk.jpg"),transparent:true,opacity:.55,depthWrite:false}));
earthGroup.add(cloudMesh);
earthMesh.add(createLabel("Earth",3.8*6,3.8+4));
clickable.push({name:"Earth",mesh:earthMesh,pivot:earthPivot,size:3.8,revSpeed:.0012,rotSpeed:.008});
const earthObj={mesh:earthMesh,pivot:earthPivot,group:earthGroup};

/* MOON */
const moonPivot=new THREE.Object3D();earthObj.group.add(moonPivot);
const moon=new THREE.Mesh(new THREE.SphereGeometry(1.2,48,48),new THREE.MeshStandardMaterial({map:tex("https://i.ibb.co/N6kHb3J1/8k-moon.jpg")}));
moon.position.x=8;moonPivot.add(moon);moon.add(createLabel("Moon",8,3));
clickable.push({name:"Moon",mesh:moon,size:1.2,revSpeed:0,rotSpeed:.0015});

/* MARS & JUPITER */
createPlanet("Mars",3,"https://i.ibb.co/5pSyfgr/8k-mars.jpg",72,.0009,.006,25);
createPlanet("Jupiter",9,"https://i.ibb.co/Y7PC31hN/8k-jupiter.jpg",96,.00045,.015,3.1);

/* SATURN */
const saturnObj=createPlanet("Saturn",8,"https://i.ibb.co/1GSg2Lnb/8k-saturn.jpg",130,.00028,.011,26.7);
const saturnRing=new THREE.Mesh(new THREE.RingGeometry(10,18,256),new THREE.MeshBasicMaterial({map:tex("https://i.ibb.co/WW38xdfv/8k-saturn-ring-alpha.png"),transparent:true,side:THREE.DoubleSide,depthWrite:false,opacity:.95}));
saturnRing.rotation.x=Math.PI/2.35;saturnObj.mesh.add(saturnRing);

/* URANUS */
const uranusObj=createPlanet("Uranus",6,"https://i.ibb.co/p60wt8Yn/2k-uranus.jpg",164,.00016,.006,97.8);
const uranusRing=new THREE.Mesh(new THREE.RingGeometry(7.5,9,128),new THREE.MeshBasicMaterial({color:0xaaccff,transparent:true,opacity:.35,side:THREE.DoubleSide}));
uranusRing.rotation.x=Math.PI/2;uranusObj.mesh.add(uranusRing);

createPlanet("Neptune",6,"https://i.ibb.co/QvqDZJ7N/2k-neptune.jpg",198,.0001,.005,28.3);

/* ASTEROIDS */
const asteroids=[];
for(let i=0;i<3500;i++){
  const rock=new THREE.Mesh(new THREE.IcosahedronGeometry(.15,0),new THREE.MeshStandardMaterial({color:0x888888,roughness:1}));
  const radius=80+Math.random()*14,angle=Math.random()*Math.PI*2;
  rock.position.set(Math.cos(angle)*radius,(Math.random()-.5)*4,Math.sin(angle)*radius);
  rock.userData={angle,radius,speed:.0001+Math.random()*.0004,rotX:(Math.random()-.5)*.02,rotY:(Math.random()-.5)*.02};
  asteroids.push(rock);scene.add(rock);
}

/* UI STATE */
let simSpeed=2,paused=false,following=null,cinema=false,autoCinema=true,returningOverview=false;
let currentPlanetIndex=0;
const overviewTarget=new THREE.Vector3(0,140,320);

/* LABEL HELPER */
function setLabelVisible(mesh,visible){
  mesh.children.forEach(c=>{if(c.isSprite)c.visible=visible;});
}
function hideAllLabels(){clickable.forEach(p=>setLabelVisible(p.mesh,true));}

/* SHOW PLANET INFO */
function showPlanetInfo(p){
  // hide only focused planet label
  hideAllLabels();
  setLabelVisible(p.mesh,false);
  following=p;cinema=false;controls.enabled=false;
  currentPlanetIndex=clickable.findIndex(x=>x.name===p.name);
  $("backBtn").style.display="block";$("planetHUD").style.display="block";
  const d=info[p.name];
  $("planetName").textContent=p.name;
  $("planetSubtitle").textContent=d.subtitle||"Solar System";
  $("hudNavLabel").textContent=(currentPlanetIndex+1)+" / "+clickable.length;
  $("planetStats").innerHTML=`
    <div class="hud-section">
      <div class="hud-section-title">📐 Physical</div>
      <div class="hud-row"><span>🔴 Radius</span><span>${d.radius}</span></div>
      <div class="hud-row"><span>⚖️ Gravity</span><span>${d.gravity}</span></div>
      <div class="hud-row"><span>🌙 Moons</span><span>${d.moons}</span></div>
    </div>
    <div class="hud-divider"></div>
    <div class="hud-section">
      <div class="hud-section-title">🕐 Motion</div>
      <div class="hud-row"><span>🔄 Rotation</span><span>${d.rotation}</span></div>
      <div class="hud-row"><span>🌀 Revolution</span><span>${d.revolution}</span></div>
    </div>
    <div class="hud-divider"></div>
    <div class="hud-section">
      <div class="hud-section-title">🌡️ Temperature</div>
      <div class="hud-row"><span>🌡️ Range</span><span>${d.temperature}</span></div>
    </div>
    <div class="hud-divider"></div>
    <div class="hud-section">
      <span class="fun-fact-label">⭐ Fun Fact</span>
      <div class="fun-fact-box">${d.funFact}</div>
    </div>
  `;
}

/* MENU / CONTROLS */
$("menuBtn").onclick=e=>{e.stopPropagation();$("panel").classList.toggle("open");};
$("speedControl").oninput=e=>{
  simSpeed=parseFloat(e.target.value);
  $("speedVal").textContent=Math.round(simSpeed*10)/10+"x";
};
$("pauseBtn").onclick=()=>{paused=!paused;$("pauseBtn").innerHTML=paused?"▶ Resume":"⏸ Pause";};
$("autoCinemaToggle").onchange=e=>{autoCinema=e.target.checked;};
$("pinchZoomToggle").onchange=e=>{controls.enableZoom=e.target.checked;};
$("cinemaBtn").onclick=()=>{cinema=!cinema;controls.enabled=!cinema;if(cinema)following=null;};
$("backBtn").onclick=()=>{
  hideAllLabels();
  following=null;returningOverview=true;controls.enabled=false;
  $("backBtn").style.display="none";$("planetHUD").style.display="none";
};
$("prevPlanet").onclick=()=>{
  currentPlanetIndex=(currentPlanetIndex-1+clickable.length)%clickable.length;
  showPlanetInfo(clickable[currentPlanetIndex]);
};
$("nextPlanet").onclick=()=>{
  currentPlanetIndex=(currentPlanetIndex+1)%clickable.length;
  showPlanetInfo(clickable[currentPlanetIndex]);
};

/* PLANET INFO */
const info={
  Sun:{
    subtitle:"Our Star",
    radius:"696,340 km",revolution:"~225M years (Galactic)",rotation:"27 Earth days",
    gravity:"274 m/s²",temperature:"Surface: 5,500°C / Core: 15M°C",moons:"—",
    funFact:"The Sun contains 99.86% of all mass in the Solar System — a million Earths could fit inside it."
  },
  Mercury:{
    subtitle:"Closest to the Sun",
    radius:"2,439 km",revolution:"87.97 Earth days",rotation:"58.6 Earth days",
    gravity:"3.7 m/s²",temperature:"-180°C to 430°C",moons:"0",
    funFact:"A day on Mercury (sunrise to sunrise) lasts longer than its entire year around the Sun!"
  },
  Venus:{
    subtitle:"Earth's Twin",
    radius:"6,051 km",revolution:"224.7 Earth days",rotation:"243 Earth days (retrograde)",
    gravity:"8.87 m/s²",temperature:"~465°C (avg)",moons:"0",
    funFact:"Venus spins backwards! On Venus, the Sun rises in the west and sets in the east."
  },
  Earth:{
    subtitle:"The Blue Marble",
    radius:"6,371 km",revolution:"365.25 days",rotation:"23h 56m",
    gravity:"9.8 m/s²",temperature:"-88°C to 58°C",moons:"1",
    funFact:"Earth is the only known planet with life, liquid oceans, and an ozone layer protecting it from radiation."
  },
  Moon:{
    subtitle:"Earth's Natural Satellite",
    radius:"1,737 km",revolution:"27.3 days (around Earth)",rotation:"27.3 days (tidally locked)",
    gravity:"1.62 m/s²",temperature:"-173°C to 127°C",moons:"—",
    funFact:"The Moon is drifting ~3.8 cm away from Earth every year — it will eventually escape Earth's gravity!"
  },
  Mars:{
    subtitle:"The Red Planet",
    radius:"3,389 km",revolution:"686.97 Earth days",rotation:"24h 37m",
    gravity:"3.72 m/s²",temperature:"-125°C to 20°C",moons:"2",
    funFact:"Olympus Mons on Mars is the tallest volcano in the solar system — 21 km high, nearly 3x Mt. Everest!"
  },
  Jupiter:{
    subtitle:"King of Planets",
    radius:"69,911 km",revolution:"11.86 Earth years",rotation:"9h 56m",
    gravity:"24.79 m/s²",temperature:"-110°C (cloud tops)",moons:"95",
    funFact:"Jupiter's Great Red Spot is a storm larger than Earth that has been raging for over 350 years!"
  },
  Saturn:{
    subtitle:"The Ringed Giant",
    radius:"58,232 km",revolution:"29.46 Earth years",rotation:"10h 34m",
    gravity:"10.44 m/s²",temperature:"-140°C (avg)",moons:"146",
    funFact:"Saturn is so light (density 0.69 g/cm³) that it would float if you could find an ocean big enough!"
  },
  Uranus:{
    subtitle:"The Ice Giant",
    radius:"25,362 km",revolution:"84 Earth years",rotation:"17h 14m",
    gravity:"8.87 m/s²",temperature:"-195°C (avg)",moons:"27",
    funFact:"Uranus orbits the Sun completely on its side with a 98° axial tilt — likely from an ancient collision."
  },
  Neptune:{
    subtitle:"The Windy World",
    radius:"24,622 km",revolution:"164.8 Earth years",rotation:"16h 6m",
    gravity:"11.15 m/s²",temperature:"-200°C (avg)",moons:"16",
    funFact:"Neptune has the strongest winds in the solar system — reaching speeds of 2,100 km/h, faster than sound!"
  }
};

/* RAYCAST — DOUBLE TAP to open info */
const raycaster=new THREE.Raycaster(),mouse=new THREE.Vector2();
let lastTapTime=0,lastTapObj=null;
renderer.domElement.addEventListener("pointerup",e=>{
  mouse.x=(e.clientX/window.innerWidth)*2-1;
  mouse.y=-(e.clientY/window.innerHeight)*2+1;
  raycaster.setFromCamera(mouse,camera);
  const hit=raycaster.intersectObjects(clickable.map(x=>x.mesh));
  if(hit.length){
    const p=clickable.find(x=>x.mesh===hit[0].object);
    if(p){
      const now=Date.now(),dt=now-lastTapTime;
      const isDoubleTap=(dt>60&&dt<400&&lastTapObj===p.name);
      lastTapTime=now;lastTapObj=p.name;
      if(isDoubleTap){
        showPlanetInfo(p);
      }
    }
  }
});

/* CINEMA */
const cinemaModes=["solarDrift","planetFlyby","ringPass","sunDive","moonChase","topDown","deepSpace","orbitSpiral","slowReveal"];
let cinemaModeIndex=0,cinemaModeTimer=0;

function setCinemaTitle(text){
  const el=$("cinemaTitle");el.textContent=text;el.classList.add("visible");
  clearTimeout(el._timeout);el._timeout=setTimeout(()=>el.classList.remove("visible"),3000);
}

function updateCinemaCamera(time){
  cinemaModeTimer+=0.0025;
  if(cinemaModeTimer>1){cinemaModeTimer=0;cinemaModeIndex=(cinemaModeIndex+1)%cinemaModes.length;}
  const mode=cinemaModes[cinemaModeIndex],cp=camera.position;
  if(mode==="solarDrift"){
    const t=time*.04;cp.set(Math.sin(t)*500,120+Math.sin(t*.5)*60,Math.cos(t)*500);camera.lookAt(0,0,0);setCinemaTitle("SOLAR DRIFT");
  }else if(mode==="planetFlyby"){
    const p=clickable[1+(Math.floor(time/8)%(clickable.length-1))];
    if(p){const pos=new THREE.Vector3();p.mesh.getWorldPosition(pos);const t=time*.6;cp.set(pos.x+Math.cos(t)*(p.size*14),pos.y+p.size*4,pos.z+Math.sin(t)*(p.size*14));camera.lookAt(pos);setCinemaTitle(p.name.toUpperCase());}
  }else if(mode==="ringPass"){
    const s=clickable.find(p=>p.name==="Saturn");
    if(s){const pos=new THREE.Vector3();s.mesh.getWorldPosition(pos);const t=time*.25;cp.set(pos.x-45+Math.sin(t)*15,pos.y+8,pos.z+Math.cos(t)*12);camera.lookAt(pos);setCinemaTitle("SATURN RING PASS");}
  }else if(mode==="sunDive"){
    const t=Math.sin(time*.3);cp.set(40+Math.sin(time*.5)*10,20+Math.cos(time*.4)*15,120+t*80);camera.lookAt(0,0,0);setCinemaTitle("SUN DIVE");
  }else if(mode==="moonChase"){
    const pos=new THREE.Vector3();moon.getWorldPosition(pos);const t=time*.8;cp.set(pos.x+Math.cos(t)*8,pos.y+3,pos.z+Math.sin(t)*8);camera.lookAt(pos);setCinemaTitle("MOON CHASE");
  }else if(mode==="topDown"){
    const t=time*.08;cp.set(Math.sin(t)*40,700,Math.cos(t)*40);camera.lookAt(0,0,0);setCinemaTitle("TOP DOWN VIEW");
  }else if(mode==="deepSpace"){
    const t=time*.015;cp.set(Math.sin(t)*1200,260+Math.sin(t*.4)*80,Math.cos(t)*1200);camera.lookAt(0,0,0);setCinemaTitle("DEEP SPACE VIEW");
  }else if(mode==="orbitSpiral"){
    const t=time*.22,r=120+Math.sin(time*.5)*60;cp.set(Math.cos(t)*r,40+t*3,Math.sin(t)*r);camera.lookAt(0,0,0);setCinemaTitle("ORBIT SPIRAL");
  }else if(mode==="slowReveal"){
    const t=time*.04;cp.set(-600+Math.sin(t)*80,140,350+Math.cos(t)*120);camera.lookAt(0,0,0);setCinemaTitle("SLOW REVEAL");
  }
}

/* AUTO CINEMA */
let idleTimer=0;
window.addEventListener("pointerdown",()=>{idleTimer=0;if(cinema){cinema=false;controls.enabled=true;}});

/* ANIMATE */
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const delta=clock.getDelta();
  idleTimer+=delta;
  if(idleTimer>8&&autoCinema&&!following&&!cinema){cinema=true;controls.enabled=false;}

  if(!paused){
    cloudMesh.rotation.y+=0.0009*simSpeed;
    clickable.forEach(p=>{if(p.pivot) p.pivot.rotation.y+=p.revSpeed*simSpeed;p.mesh.rotation.y+=p.rotSpeed*simSpeed;});
    moonPivot.rotation.y+=.004*simSpeed;
    asteroids.forEach(r=>{
      r.userData.angle+=r.userData.speed*simSpeed;
      r.position.x=Math.cos(r.userData.angle)*r.userData.radius;
      r.position.z=Math.sin(r.userData.angle)*r.userData.radius;
      r.rotation.x+=r.userData.rotX;r.rotation.y+=r.userData.rotY;
    });
  }

  if(following){
    const pos=new THREE.Vector3();following.mesh.getWorldPosition(pos);
    // offset camera RIGHT so planet appears LEFT of center (info card is on right)
    const offset=new THREE.Vector3(following.size*6,following.size*2,following.size*9);
    camera.position.lerp(pos.clone().add(offset),.05);
    controls.target.lerp(pos,.08);camera.lookAt(controls.target);
  }else if(cinema){
    updateCinemaCamera(clock.elapsedTime);
  }else{
    controls.update();
  }

  if(returningOverview){
    camera.position.lerp(overviewTarget,.045);
    controls.target.lerp(new THREE.Vector3(0,0,0),.05);
    camera.lookAt(controls.target);
    if(camera.position.distanceTo(overviewTarget)<1){returningOverview=false;controls.enabled=true;}
  }

  /* STARS */
  const t=Date.now()*.002;
  [bgStars,fgStars].forEach(s=>{s.material.opacity=0.75+Math.random()*.25;s.material.size=0.8+Math.sin(t*1)*.35;s.rotation.y+=0.00002;});
  fgStars.rotation.y+=0.00015;fgStars.rotation.x+=0.00002;
  scene.rotation.y+=0.00003;

  renderer.render(scene,camera);
}
animate();

/* RESIZE */
window.addEventListener("resize",()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});

/* MUSIC */
const bgMusic=$("bgMusic");bgMusic.volume=0.35;let musicPlaying=false;
$("musicBtn").onclick=()=>{
  if(!musicPlaying){bgMusic.play();musicPlaying=true;$("musicBtn").innerHTML="⏸ Pause Music";}
  else{bgMusic.pause();musicPlaying=false;$("musicBtn").innerHTML="🎵 Play Music";}
};

</script>
